<text x="212" y="96.6" font-family="FangSong,仿宋,SimSun,serif" font-size="2.85" text-anchor="start" fill="#a14e14">* X=7/12 为居中错位约5的假设。</text>
<text x="212" y="101.8" font-family="FangSong,仿宋,SimSun,serif" font-size="2.85" text-anchor="start" fill="#171717">  商家未确认到侧边的准确距离。</text>
<text x="212" y="107.0" font-family="FangSong,仿宋,SimSun,serif" font-size="2.85" text-anchor="start" fill="#a14e14">* B 面纵向位置暂参照 A 面设置。</text>
<text x="212" y="112.2" font-family="FangSong,仿宋,SimSun,serif" font-size="2.85" text-anchor="start" fill="#171717"># A 面 Y=23/11 由31、8、12推算。</text>
<text x="212" y="117.4" font-family="FangSong,仿宋,SimSun,serif" font-size="2.85" text-anchor="start" fill="#171717">  9的起点暂按底板内表面理解；</text>
<text x="212" y="122.6" font-family="FangSong,仿宋,SimSun,serif" font-size="2.85" text-anchor="start" fill="#171717">  8+12+9=29，加板厚2得到31。</text>
<text x="212" y="127.80000000000001" font-family="FangSong,仿宋,SimSun,serif" font-size="2.85" text-anchor="start" fill="#171717">  这一尺寸基准须对照实物核对。</text>
<text x="212" y="133.0" font-family="FangSong,仿宋,SimSun,serif" font-size="2.85" text-anchor="start" fill="#171717">材质、折弯R、外圆角、孔口形状、</text>
